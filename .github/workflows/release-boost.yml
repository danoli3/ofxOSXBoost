name: Build and prepare Boost for macOS
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate only or prepare artifacts
        required: true
        default: validate
        type: choice
        options: [validate, prepare]
  push:
    branches: [master]
permissions:
  actions: write
  contents: write
concurrency:
  group: boost-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15-intel
    env:
      BOOST_VERSION: 1.92.0
      OSX_MIN_VERSION: '10.15'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build release artifacts
        run: ./scripts/build-boost-osx
      - name: Verify slices, symbols, and checksums
        run: |
          work="$(mktemp -d)"
          tar -xzf "dist/ofxOSXBoost-$BOOST_VERSION.tar.gz" -C "$work"
          frame="$work/ofxOSXBoost-$BOOST_VERSION/libs/boost/osx/boost.xcframework"
          lib="$frame/macos-arm64_x86_64/libboost.a"
          plutil -lint "$frame/Info.plist"
          archs="$(xcrun lipo -archs "$lib")"
          [[ "$archs" == 'x86_64 arm64' || "$archs" == 'arm64 x86_64' ]]
          for arch in arm64 x86_64; do
            xcrun nm -arch "$arch" -gU "$lib" > "$work/$arch.nm"
            for symbol in _make_fcontext _jump_fcontext _ontop_fcontext boost8charconv; do grep -Fq "$symbol" "$work/$arch.nm"; done
            ! grep -Fiq quadmath "$work/$arch.nm"
          done
          (cd dist && shasum -a 256 -c "ofxOSXBoost-$BOOST_VERSION.tar.gz.sha256" && shasum -a 256 -c "ofxOSXBoost-$BOOST_VERSION-xcframework.zip.sha256")
      - name: Build native consumers
        run: |
          ./example-xcframework/build.sh "dist/ofxOSXBoost-$BOOST_VERSION.tar.gz"
          xcodebuild -project example-xcframework/ofxOSXBoostContextExample.xcodeproj \
            -scheme ofxOSXBoostContextExample -configuration Release -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/ofxosxboost-example" CODE_SIGNING_ALLOWED=NO build
          OFXOSXBOOST_CI=1 "$RUNNER_TEMP/ofxosxboost-example/Build/Products/Release/ofxOSXBoostContextExample.app/Contents/MacOS/ofxOSXBoostContextExample"
          ./example-swift-package/build.sh "dist/ofxOSXBoost-$BOOST_VERSION.tar.gz"
          pod lib lint dist/ofxOSXBoost.podspec --platforms=osx
      - name: Audit and clean-test Homebrew formula
        run: |
          sha="$(awk '{print $1}' "dist/ofxOSXBoost-$BOOST_VERSION.tar.gz.sha256")"
          sed -e "s|@BOOST_VERSION@|$BOOST_VERSION|g" -e "s|@ARCHIVE_SHA@|$sha|g" packaging/homebrew/ofxOSXBoost.rb.in > dist/ofxOSXBoost.rb
          brew audit --strict dist/ofxOSXBoost.rb
          brew install --formula "$(pwd)/dist/ofxOSXBoost.rb"
          brew test ofxosxboost
          brew uninstall ofxosxboost
      - name: Finalize prepared source and artifacts
        if: inputs.operation == 'prepare'
        run: |
          checksum="$(swift package compute-checksum "dist/ofxOSXBoost-$BOOST_VERSION-xcframework.zip")"
          sed -E "s/checksum: \"[0-9a-f]{64}\"/checksum: \"$checksum\"/" Package.swift > "$RUNNER_TEMP/Package.swift"
          mv "$RUNNER_TEMP/Package.swift" Package.swift
          grep -Fq "checksum: \"$checksum\"" Package.swift
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Package.swift
          git diff --cached --quiet || git commit -m "Finalize Boost $BOOST_VERSION prepared checksum [skip ci]"
          git push origin HEAD:refs/heads/master
          ./scripts/finalize-prepared-artifacts.sh "$BOOST_VERSION" dist
          printf 'BOOST_VERSION=%s\nSOURCE_SHA=%s\nXCFRAMEWORK_SHA256=%s\nPREPARATION_RUN_ID=%s\n' "$BOOST_VERSION" "$(git rev-parse HEAD)" "$checksum" "$GITHUB_RUN_ID" > dist/release-manifest.env
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ofxOSXBoost-1.92.0
          path: dist
          if-no-files-found: error
