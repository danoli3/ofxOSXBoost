name: Publish prepared Boost release
on:
  workflow_dispatch:
    inputs:
      preparation_run_id:
        description: Successful preparation run ID
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: boost-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-15-intel
    environment: release
    env:
      BOOST_VERSION: 1.92.0
      PREPARATION_RUN_ID: ${{ inputs.preparation_run_id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ofxOSXBoost-1.92.0
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.preparation_run_id }}
      - name: Verify prepared handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARATION_RUN_ID" --jq .conclusion)" = success
          test "$(awk -F= '$1 == "BOOST_VERSION" {print $2}' dist/release-manifest.env)" = "$BOOST_VERSION"
          source_sha="$(awk -F= '$1 == "SOURCE_SHA" {print $2}' dist/release-manifest.env)"
          checksum="$(awk -F= '$1 == "XCFRAMEWORK_SHA256" {print $2}' dist/release-manifest.env)"
          git checkout --detach "$source_sha"
          grep -Fq "checksum: \"$checksum\"" Package.swift
          (cd dist && shasum -a 256 -c "ofxOSXBoost-$BOOST_VERSION.tar.gz.sha256" && shasum -a 256 -c "ofxOSXBoost-$BOOST_VERSION-xcframework.zip.sha256")
          test "$(swift package compute-checksum "dist/ofxOSXBoost-$BOOST_VERSION-xcframework.zip")" = "$checksum"
          ! gh release view "$BOOST_VERSION" >/dev/null 2>&1
      - name: Push verified tag
        run: |
          git tag "$BOOST_VERSION" "$(git rev-parse HEAD)"
          git push origin "refs/tags/$BOOST_VERSION"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          ./scripts/generate-release-notes.sh "$BOOST_VERSION" "$notes"
          gh release create "$BOOST_VERSION" --title "Boost $BOOST_VERSION for macOS" --notes-file "$notes" \
            "dist/ofxOSXBoost-$BOOST_VERSION.tar.gz" "dist/ofxOSXBoost-$BOOST_VERSION.tar.gz.sha256" \
            "dist/ofxOSXBoost-$BOOST_VERSION-xcframework.zip" "dist/ofxOSXBoost-$BOOST_VERSION-xcframework.zip.sha256" \
            "dist/ofxOSXBoost.podspec" "dist/ofxOSXBoost.rb"
      - name: Prepare post-release submissions
        run: |
          pod spec lint dist/ofxOSXBoost.podspec --platforms=osx
          brew audit --strict dist/ofxOSXBoost.rb
          echo "CocoaPods and Homebrew files are validated but are not submitted automatically."
